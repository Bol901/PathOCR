name: Build cross-platform packages
on:
  workflow_dispatch:
    inputs:
      offline:
        description: Bundle model weights for fully offline use
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.21.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py --offline
        if: github.event_name == 'workflow_dispatch' && inputs.offline
      - run: python scripts/build.py
        if: github.event_name == 'push' || !inputs.offline
      - uses: actions/upload-artifact@v4
        with:
          name: PathOCR-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
